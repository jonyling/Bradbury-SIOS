[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bradbury-sios"
version = "0.1.0"
description = "Bradbury SIOS: SME SI Operating System for Bradbury Consulting Pte Ltd."
requires-python = ">=3.11"

[project.scripts]
sios = "sios.cli:main"
grit = "grit.cli:main"

[tool.setuptools.packages.find]
include = ["sios*", "grit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["quarantined", ".*", "build", "dist", "*.egg", "archive"]
